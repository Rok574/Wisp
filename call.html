
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WispRTC">
    <meta name="theme-color" content="#0b0d12">
    <title>WispRTC</title>
    <style>
        :root {
            --bg: #0b0d12;
            --panel: #16181f;
            --panel-2: #1c1f29;
            --line: rgba(255,255,255,.08);
            --text: #f4f6fb;
            --muted: #9aa3b5;
            --dim: #6f7890;
            --accent: #6d7cff;
            --accent-2: #5460e8;
            --green: #3dd68c;
            --red: #f23f42;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --bar-space: calc(118px + var(--safe-bottom));
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
        body {
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(900px 480px at 50% -20%, rgba(109,124,255,.18), transparent 55%),
                var(--bg);
        }
        body.in-call { background: #0b0d12; overflow: hidden; }
        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 6;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.2px; }
        .logo {
            width: 32px; height: 32px; border-radius: 10px;
            background: linear-gradient(180deg, #8b97ff, #5b67f5);
            display: grid; place-items: center;
            box-shadow: 0 8px 20px rgba(91,103,245,.28);
        }
        .logo svg { width: 18px; height: 18px; display: block; }
        .live {
            display: none; align-items: center; gap: 10px;
            font-size: 13px; color: var(--muted);
            background: rgba(255,255,255,.04);
            border: 1px solid var(--line);
            padding: 6px 8px 6px 12px;
            border-radius: 999px;
        }
        .live.on { display: flex; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        .copy {
            border: 0; background: rgba(255,255,255,.08); color: #fff;
            border-radius: 999px; padding: 6px 11px; font-weight: 650; font-size: 12px;
        }
        #httpsWarn {
            display: none; margin: 0 16px 12px; padding: 10px 12px;
            background: #3a2a12; color: #f0c36a; border-radius: 12px; font-size: 13px;
        }
        #lobbyWrap {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 12px 16px 28px;
        }
        body.in-call #lobbyWrap { display: none; }
        #lobby {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 28px 24px 22px;
            box-shadow: 0 24px 80px rgba(0,0,0,.35);
        }
        #lobby h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.4px; }
        #lobby p { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.45; }
        label {
            display: block; font-size: 11px; font-weight: 750;
            letter-spacing: .5px; color: var(--dim);
            margin: 16px 0 8px; text-transform: uppercase;
        }
        #lobby input {
            width: 100%; padding: 14px 14px; border: 1px solid var(--line);
            border-radius: 12px; background: var(--panel-2); color: var(--text);
            font-size: 16px; outline: none;
        }
        #lobby input:focus { border-color: var(--accent); }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .actions button {
            flex: 1; border: 0; border-radius: 12px; padding: 13px 10px;
            font-weight: 750; font-size: 15px; color: #fff;
        }
        .go { background: var(--accent); }
        .go:active { background: var(--accent-2); }
        .ghost { background: #2a2e3a; }
        .user-row {
            display: flex; align-items: center; gap: 10px;
            margin-top: 16px; color: var(--muted); font-size: 13px;
        }
        .ava {
            width: 28px; height: 28px; border-radius: 50%;
            display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 12px;
            background: var(--accent);
        }
        #stage {
            display: none;
            flex: 1;
            position: relative;
            min-height: 0;
        }
        body.in-call #stage { display: block; height: 100%; min-height: 0; }
        #videos {
            height: 100%;
            display: grid;
            gap: 12px;
            padding: 4px 16px var(--bar-space);
            align-content: stretch;
            justify-items: stretch;
            grid-template-columns: 1fr;
            grid-auto-rows: minmax(0, 1fr);
        }
        #videos.one { grid-template-columns: 1fr; }
        #videos.count-2 { grid-template-columns: 1fr; }
        #videos.count-3, #videos.count-4 { grid-template-columns: 1fr 1fr; }
        #videos.count-5, #videos.count-6, #videos.count-7, #videos.count-8, #videos.count-9 {
            grid-template-columns: 1fr 1fr 1fr;
        }
        #videos.many {
            overflow: auto;
            grid-auto-rows: minmax(140px, 1fr);
        }
        #videos.many .tile.local {
            position: relative !important;
            width: auto !important;
            height: auto !important;
            right: auto !important;
            bottom: auto !important;
            box-shadow: none;
        }
        .tile {
            position: relative;
            background: #12141b;
            border-radius: 18px;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            border: 1px solid var(--line);
            cursor: pointer;
        }
        .tile.focused { cursor: zoom-out; border-color: rgba(109,124,255,.45); }
        #videos.focus {
            grid-template-columns: 1fr !important;
            grid-template-rows: 1fr;
        }
        #videos.focus > .tile { display: none; }
        #videos.focus > .tile.focused {
            display: block;
            position: relative !important;
            width: auto !important;
            height: auto !important;
            right: auto !important;
            bottom: auto !important;
            min-height: 0;
            z-index: 1;
            box-shadow: none;
        }
        #videos.focus > .tile.local:not(.focused) {
            display: block;
            position: absolute !important;
            width: min(160px, 34vw) !important;
            height: 100px !important;
            right: 16px !important;
            bottom: var(--bar-space) !important;
            z-index: 6;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,.45);
        }
        #videos.focus > .tile.focused.sharing video,
        #videos.focus > .tile.focused.fit video { object-fit: contain; }
        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover !important;
            object-position: center;
            background: #0a0c11;
            display: block;
        }
        .tile.fit video { object-fit: contain !important; }
        .tile.sharing video { object-fit: contain !important; }
        .tile.local:not(.sharing) video { object-fit: cover !important; }
        .tile.local.fit:not(.sharing) video { object-fit: contain !important; }
        .tile.remote:not(.sharing):not(.fit) video { object-fit: cover !important; }
        .tile.local video { transform: scaleX(-1); }
        .tile.remote.front-cam video { transform: scaleX(-1); }
        .tile.local.back-camera video,
        .tile.local.sharing video,
        .tile.remote.sharing video,
        .tile.remote.back-cam video { transform: none; }
        .tile.cam-off video { opacity: 0; }
        .cam-off-badge {
            display: none; position: absolute; inset: 0;
            align-items: center; justify-content: center; flex-direction: column; gap: 10px;
            background: #141722; color: var(--muted); font-size: 13px; font-weight: 700;
        }
        .tile.cam-off .cam-off-badge { display: flex; }
        .tile-wait {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 4;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            background: rgba(10,12,18,.55);
            color: #fff;
            font-size: 13px;
            font-weight: 750;
        }
        .tile.waiting .tile-wait {
            display: flex;
            background: rgba(10,12,18,.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
        .tile.waiting video,
        .tile.waiting .tile-snap {
            filter: blur(22px) saturate(.5);
            transform: scale(1.12);
        }
        .tile-snap {
            display: none;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: saturate(.85);
        }
        .tile.waiting .tile-snap[src] { display: block; }
        .tile.cam-off .tile-snap,
        .tile.cam-off.waiting .tile-snap { display: none !important; }
        .tile.cam-off.waiting .tile-wait { display: none; }
        .spin {
            width: 28px; height: 28px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,.2);
            border-top-color: #fff;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cam-off-badge .ava { width: 72px; height: 72px; font-size: 26px; }
        .label {
            position: absolute; left: 12px; bottom: 12px;
            font-size: 13px; font-weight: 700;
            background: rgba(10,12,18,.72);
            backdrop-filter: blur(10px);
            padding: 6px 10px; border-radius: 999px;
            display: flex; align-items: center; gap: 7px;
            max-width: calc(100% - 90px);
            z-index: 2;
        }
        .micdot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .micdot.off { background: var(--red); }
        .tile-btns { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 2; }
        .tile-btns button {
            height: 32px; padding: 0 10px; border: 0; border-radius: 999px;
            background: rgba(10,12,18,.72); color: #fff; font-size: 12px; font-weight: 700;
        }
        .tile-btns button.on { background: var(--red); }
        .share-pill {
            display: none;
            position: absolute; top: 12px; left: 12px;
            font-size: 11px; font-weight: 800; letter-spacing: .3px;
            background: var(--accent); color: #fff;
            padding: 5px 10px; border-radius: 999px; z-index: 2;
        }
        .tile.sharing .share-pill { display: block; }
        @media (min-width: 760px) {
            #videos.count-2 { grid-template-columns: 1fr; padding-right: 16px; }
            #videos:not(.one) .tile.local {
                position: absolute;
                width: min(260px, 30vw);
                height: min(168px, 22vh);
                right: 22px;
                bottom: var(--bar-space);
                z-index: 5;
                border-radius: 16px;
                box-shadow: 0 16px 40px rgba(0,0,0,.4);
            }
            #videos.count-3, #videos.count-4 { grid-template-columns: 1fr 1fr; }
            #videos.count-5, #videos.count-6, #videos.count-7, #videos.count-8, #videos.count-9 {
                grid-template-columns: 1fr 1fr 1fr;
            }
            #videos.many .tile.local {
                position: relative !important;
                width: auto !important;
                height: auto !important;
            }
        }
        @media (max-width: 759px) {
            #videos { padding: 0 12px var(--bar-space); gap: 10px; }
            #videos.count-2 .tile.local { min-height: 140px; }
            .tile { border-radius: 16px; }
        }
        .bar {
            position: fixed; left: 50%; bottom: calc(16px + var(--safe-bottom));
            transform: translateX(-50%);
            display: none;
            align-items: center; gap: 8px;
            padding: 10px 12px;
            background: rgba(22,24,31,.86);
            border: 1px solid var(--line);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            z-index: 8;
            max-width: calc(100vw - 16px);
            overflow-x: auto;
        }
        body.in-call .bar { display: flex; }
        .bar button {
            width: 48px; height: 48px; border: 0; border-radius: 50%;
            background: #2a2e3a; color: #fff; font-size: 10px; font-weight: 750;
            flex-shrink: 0;
        }
        .bar button.on { background: var(--red); }
        .bar #shareBtn.on { background: var(--accent); }
        .bar #fxBtn.on { background: var(--accent); }
        .bar #hangup { background: var(--red); width: 56px; }
        #fxPanel {
            display: none;
            position: fixed;
            left: 50%;
            bottom: calc(88px + var(--safe-bottom));
            transform: translateX(-50%);
            z-index: 9;
            background: rgba(22,24,31,.94);
            border: 1px solid var(--line);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 10px;
            width: min(420px, calc(100vw - 20px));
        }
        #fxPanel.on { display: block; }
        #fxPanel h3 {
            margin: 0 8px 8px;
            font-size: 12px;
            letter-spacing: .4px;
            text-transform: uppercase;
            color: var(--dim);
        }
        .fx-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .fx-item {
            border: 1px solid var(--line);
            background: #1c1f29;
            color: #fff;
            border-radius: 14px;
            padding: 10px 6px 8px;
            font-size: 11px;
            font-weight: 750;
            min-height: 72px;
        }
        .fx-item.on { border-color: var(--accent); background: #262a3d; }
        .fx-ico { font-size: 22px; display: block; margin-bottom: 4px; }
        #fxSrc, #fxCanvas {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 1280px;
            height: 720px;
            opacity: 0;
            pointer-events: none;
        }
        .log { display: none; }
        @media (min-width: 760px) {
            .bar button { width: 52px; height: 52px; }
        }
        @media (orientation: landscape) and (max-height: 520px) {
            :root { --bar-space: 8px; }
            body { min-height: 100dvh; }
            body.in-call .topbar {
                height: 32px;
                padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            }
            body.in-call .logo { width: 22px; height: 22px; border-radius: 7px; }
            body.in-call .logo svg { width: 12px; height: 12px; }
            body.in-call .brand { font-size: 13px; gap: 8px; }
            body.in-call .live { padding: 3px 6px 3px 8px; font-size: 11px; }
            body.in-call .copy { padding: 4px 8px; font-size: 11px; }
            #lobbyWrap {
                align-items: stretch;
                padding: 6px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
            }
            #lobby {
                width: min(720px, 100%);
                padding: 14px 16px 12px;
                border-radius: 16px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto auto;
                column-gap: 16px;
                align-content: start;
            }
            #lobby h2 { font-size: 20px; grid-column: 1; margin: 0 0 4px; }
            #lobby p { display: none; }
            #lobby label[for="nameInput"], #nameInput { grid-column: 1; }
            #lobby label[for="roomInput"], #roomInput { grid-column: 2; }
            #lobby label { margin: 6px 0 6px; }
            #lobby input { padding: 10px 12px; }
            #lobby > div[style] { display: none; }
            #lobby .actions { grid-column: 1 / -1; margin-top: 10px; }
            #lobby .user-row { grid-column: 1 / -1; margin-top: 8px; }
            #videos {
                padding: 2px 76px 4px max(6px, env(safe-area-inset-left));
                gap: 8px;
            }
            #videos.count-2 { grid-template-columns: 1fr; }
            #videos.count-2 .tile.local { min-height: 0; }
            #videos.count-3, #videos.count-4 { grid-template-columns: 1fr 1fr; }
            #videos:not(.one):not(.focus) .tile.local {
                position: absolute;
                width: min(132px, 28vw);
                height: 78px;
                right: calc(76px + env(safe-area-inset-right, 0px));
                bottom: 8px;
                z-index: 5;
                border-radius: 12px;
                box-shadow: 0 10px 24px rgba(0,0,0,.4);
            }
            #videos.focus { padding-right: 76px; }
            #videos.focus > .tile.local:not(.focused) {
                width: 110px !important;
                height: 68px !important;
                right: calc(76px + env(safe-area-inset-right, 0px)) !important;
                bottom: 8px !important;
            }
            .tile { border-radius: 12px; }
            .label { left: 8px; bottom: 8px; font-size: 12px; padding: 4px 8px; }
            .tile-btns { right: 8px; bottom: 8px; }
            .tile-btns button { height: 26px; font-size: 11px; }
            .cam-off-badge .ava { width: 48px; height: 48px; font-size: 18px; }
            .bar {
                left: auto;
                right: max(6px, env(safe-area-inset-right));
                top: 50%;
                bottom: auto;
                transform: translateY(-50%);
                flex-direction: column;
                gap: 6px;
                padding: 8px;
                max-width: none;
                max-height: calc(100dvh - 16px);
                overflow-y: auto;
                overflow-x: hidden;
            }
            .bar button {
                width: 40px;
                height: 40px;
                font-size: 9px;
            }
            .bar #hangup { width: 40px; height: 42px; }
            #fxPanel {
                left: auto;
                right: calc(58px + env(safe-area-inset-right, 0px));
                top: 50%;
                bottom: auto;
                transform: translateY(-50%);
                width: min(300px, calc(100vw - 90px));
            }
            .fx-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 15c3-8 11-8 14 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M8 16.5c2-4.5 6-4.5 8 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="12" cy="18.2" r="1.5" fill="#fff"/>
                </svg>
            </div>
            WispRTC
        </div>
        <div id="roomChip" class="live">
            <span class="dot"></span>
            <span id="roomLabel">room</span>
            <button id="copyBtn" class="copy" type="button">Copy</button>
        </div>
    </div>
    <div id="httpsWarn">iPhone and iPad need HTTPS for camera and mic.</div>
    <div id="lobbyWrap">
        <div id="lobby">
            <h2>Hop into a room</h2>
            <p>Your username is saved on this device. Share a room code with anyone, even on another WiFi.</p>
            <label for="nameInput">Username</label>
            <input id="nameInput" type="text" placeholder="cooluser" maxlength="20" autocomplete="username" autocapitalize="off">
            <label for="roomInput">Room code</label>
            <input id="roomInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="Custom code (optional)">
            <div style="margin-top:7px;color:var(--dim);font-size:12px;">Enter any code to create or join that room.</div>
            <div class="actions">
                <button class="go" id="joinBtn" type="button">Join</button>
                <button class="ghost" id="createBtn" type="button">New room</button>
            </div>
            <div class="user-row">
                <div class="ava" id="previewAva">?</div>
                <span id="savedHint">No saved username yet</span>
            </div>
        </div>
    </div>
    <div id="stage">
        <div id="videos" class="one count-1">
            <div class="tile local" id="localTile">
                <video id="localVideo" autoplay playsinline webkit-playsinline muted></video>
                <div class="share-pill">Sharing screen</div>
                <div class="cam-off-badge">
                    <div class="ava" id="localAva">Y</div>
                    Camera off
                </div>
                <div class="label"><span class="micdot" id="localMicDot"></span><span id="localName">You</span></div>
                <div class="tile-btns">
                    <button id="fitBtn" type="button">Fit</button>
                </div>
            </div>
        </div>
    </div>
    <div class="bar" id="callBar">
        <button id="muteBtn" type="button">Mute</button>
        <button id="camBtn" type="button">Video</button>
        <button id="flipBtn" type="button">Flip</button>
        <button id="shareBtn" type="button">Share</button>
        <button id="fxBtn" type="button">FX</button>
        <button id="hangup" type="button">Leave</button>
    </div>
    <div id="fxPanel">
        <h3>Effects</h3>
        <div class="fx-grid">
            <button class="fx-item on" data-fx="off" type="button"><span class="fx-ico">🚫</span>None</button>
            <button class="fx-item" data-fx="glasses" type="button"><span class="fx-ico">🤓</span>Glasses</button>
            <button class="fx-item" data-fx="ears" type="button"><span class="fx-ico">🐱</span>Cat ears</button>
            <button class="fx-item" data-fx="party" type="button"><span class="fx-ico">😻</span>Glasses + ears</button>
        </div>
    </div>
    <video id="fxSrc" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="fxCanvas"></canvas>
    <div id="statusLog" class="log"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import {
            getDatabase, ref, set, push, onValue, onChildAdded, onChildRemoved, remove, runTransaction, onDisconnect
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCjbcnSZc5uEcbEqgn68H-CLx2MoMpuqgA",
            authDomain: "jhghugjh-432da.firebaseapp.com",
            databaseURL: "https://jhghugjh-432da-default-rtdb.firebaseio.com",
            projectId: "jhghugjh-432da",
            storageBucket: "jhghugjh-432da.firebasestorage.app",
            messagingSenderId: "138235206183",
            appId: "1:138235206183:web:a49161586a06401664cc02",
            measurementId: "G-BDTG9XPRSQ"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const USER_KEY = "wisprtc.username";
        const FIT_KEY = "wisprtc.fill";

            };
            btns.appendChild(muteThem);
            tile.append(v, snapImg, waitEl, sharePill, badge, label, btns);
            bindTileFocus(tile);
            videosEl.appendChild(tile);
            layout();
            }
            v.srcObject = remoteStream;
            playVideo(v);
            updateRemoteChrome(remoteId, info);
            pc.ontrack = (ev) => {
                const incoming = ev.streams && ev.streams[0];
                const tracks = incoming ? incoming.getTracks() : (ev.track ? [ev.track] : []);
                tracks.forEach(t => {
                    if (!remoteStream.getTracks().some(x => x.id === t.id)) remoteStream.addTrack(t);
                });
                if (ev.track && !remoteStream.getTracks().some(x => x.id === ev.track.id)) {
                    remoteStream.addTrack(ev.track);
                }
                if (ev.track) {
                    ev.track.onunmute = () => {
                        v.srcObject = remoteStream;
                        playVideo(v);
                    };
                    ev.track.onended = () => {
                        try { remoteStream.removeTrack(ev.track); } catch (_) {}
                    };
                }
                const p = peers.get(remoteId);
                if (p?.muted) remoteStream.getAudioTracks().forEach(t => t.enabled = false);
                v.srcObject = remoteStream;
                v.muted = false;
                setPeerWait(remoteId, false);
                playVideo(v);
            };
            pc.onconnectionstatechange = () => {
                log((info.name || remoteId.slice(0, 6)) + ": " + pc.connectionState);
                if (pc.connectionState === "connected") setPeerWait(remoteId, false);
                if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
                    setPeerWait(remoteId, true, "Reconnecting");
                    try { pc.restartIce(); } catch (_) {}
                    setTimeout(() => {
                        const cur = peers.get(remoteId);
                        if (!cur || cur.pc !== pc) return;
                        if (pc.connectionState === "connected") return;
                        rebuildPeer(remoteId, info, true);
                    }, 3000);
                }
            };
            if (!relayOnly) {
                const wait = onCellular() ? 3500 : 10000;
                setTimeout(async () => {
                    const entry = peers.get(remoteId);
                    if (!entry || entry.pc !== pc) return;
                    if (pc.connectionState === "connected" || pc.iceConnectionState === "connected") return;
                    if (remoteStream.getTracks().length) return;
                    teardownPeer(remoteId);
                    await ensurePeer(remoteId, iAmOfferer, true, info);
                }, wait);
            }
            const candRef = ref(db, signalPath(myId, remoteId, "candidates/" + myId, relayOnly));
            pc.onicecandidate = (ev) => { if (ev.candidate) push(candRef, ev.candidate.toJSON()); };
            unsubscribers.push(onChildAdded(ref(db, signalPath(myId, remoteId, "candidates/" + remoteId, relayOnly)), (snap) => {
                if (snap.val()) pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(() => {});
            }));
            const offerRef = ref(db, signalPath(myId, remoteId, "offer", relayOnly));
            const answerRef = ref(db, signalPath(myId, remoteId, "answer", relayOnly));
            if (iAmOfferer) {
                const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
                await pc.setLocalDescription(offer);
                await set(offerRef, { type: offer.type, sdp: offer.sdp });
                unsubscribers.push(onValue(answerRef, async (snap) => {
                    const data = snap.val();
                    if (data && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                    }
                }));
            } else {
                unsubscribers.push(onValue(offerRef, async (snap) => {
                    const data = snap.val();
                    if (!data || pc.currentRemoteDescription) return;
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await set(answerRef, { type: answer.type, sdp: answer.sdp });
                }));
            }
        }
        function teardownPeer(remoteId) {
            const entry = peers.get(remoteId);
            if (!entry) return;
            entry.unsubscribers.forEach(fn => { try { fn(); } catch (_) {} });
            try { entry.pc.close(); } catch (_) {}
            peers.delete(remoteId);
            const gone = "tile-" + remoteId;
            document.getElementById(gone)?.remove();
            if (focusedTileId === gone) setFocusedTile(null);
            else layout();
        }
        function onPageHide() {
            if (roomId && myId) {
                remove(ref(db, `rooms/${roomId}/participants/${myId}`));
                remove(ref(db, `rooms/${roomId}/previews/${myId}`));
            }
        }
        async function leaveRoom(showLobby) {
            window.removeEventListener("pagehide", onPageHide);
            window.removeEventListener("beforeunload", onPageHide);
            window.removeEventListener("online", recoverPeers);
            document.removeEventListener("visibilitychange", onVisible);
            stopPresenceTimers();
            if (participantsUnsub) { try { participantsUnsub(); } catch (_) {} participantsUnsub = null; }
            if (removedUnsub) { try { removedUnsub(); } catch (_) {} removedUnsub = null; }
            if (partsValueUnsub) { try { partsValueUnsub(); } catch (_) {} partsValueUnsub = null; }
            if (previewUnsub) { try { previewUnsub(); } catch (_) {} previewUnsub = null; }
            [...peers.keys()].forEach(teardownPeer);
            const leavingRoomId = roomId;
            const leavingUserId = myId;
            if (leavingRoomId && leavingUserId) {
                try {
                    await remove(ref(db, `rooms/${leavingRoomId}/participants/${leavingUserId}`));
                    await remove(ref(db, `rooms/${leavingRoomId}/previews/${leavingUserId}`));
                    await deleteRoomIfEmpty(leavingRoomId);
                } catch (_) {}
            }
            roomId = null;
            myId = null;
            if (showLobby) {
                setInCall(false);
                roomChip.classList.remove("on");
                await stopShare();
                stopFxLoop();
                fxPanel.classList.remove("on");
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = null;
                }
                localVideo.srcObject = null;
                micOn = true;
                camOn = true;
                sharing = false;
                localTile.classList.remove("cam-off", "sharing");
                nameInput.value = storeGet(USER_KEY);
                refreshUserPreview();
                applyLocalMediaState();
            }
        }
    </script>
</body>
