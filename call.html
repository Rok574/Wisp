<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Mobile Call</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: white; padding: 15px; margin: 0; text-align: center; }
        h2 { margin-top: 10px; font-size: 20px; }
        .video-container { display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 15px; }
        video { width: 90%; max-width: 360px; background: #000; border-radius: 12px; aspect-ratio: 4/3; object-fit: cover; }
        #localVideo { transform: scaleX(-1); border: 2px solid #333; }
        #remoteVideo { border: 2px solid #007aff; }
        .controls { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto 15px auto; padding: 10px; background: #1e1e1e; border-radius: 12px; }
        button, input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 100%; box-sizing: border-box; }
        button { background: #007aff; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }
        input { background: #2c2c2e; color: white; text-align: center; }
        .log-box { font-family: monospace; font-size: 12px; color: #aaa; margin-top: 10px; padding: 5px; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Firebase WebRTC Mobile Call</h2>
    
    <div class="controls">
        <button id="startBtn">1. Allow Camera & Mic</button>
        <button id="createBtn" disabled>2. Create New Call</button>
        <input type="text" id="callIdInput" placeholder="Paste Call ID to Join...">
        <button id="joinBtn" disabled>3. Join Existing Call</button>
    </div>

    <div class="video-container">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="statusLog" class="log-box">Status: Waiting for media initialization...</div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, push, onValue, get } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCjbcnSZc5uEcbEqgn68H-CLx2MoMpuqgA",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "jhghugjh-432da",
            storageBucket: "jhghugjh-432da.firebasestorage.app",
            messagingSenderId: "138235206183",
            appId: "1:138235206183:web:a49161586a06401664cc02",
            measurementId: "G-BDTG9XPRSQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Standard global STUN servers configuration
        const servers = {
            iceServers: [
                { urls: ['stun:://google.com', 'stun:://google.com'] }
            ],
            iceCandidatePoolSize: 10,
        };

        let pc = new RTCPeerConnection(servers);
        let localStream = null;
        let remoteStream = null;

        const startBtn = document.getElementById('startBtn');
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        const callIdInput = document.getElementById('callIdInput');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusLog = document.getElementById('statusLog');

        function log(text) {
            statusLog.innerText = `Status: ${text}`;
            console.log(text);
        }

        // 1. Initializing Camera and Microphone safely for mobile environments
        startBtn.onclick = async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("WebRTC Media Error: Your mobile browser is blocking camera access because this site isn't using a secure connection (HTTPS). Ensure you deploy via HTTPS.");
                log("Failed: Insecure context.");
                return;
            }

            try {
                // Constraints target mobile phone cameras specifically
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: true 
                });
                
                remoteStream = new MediaStream();

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                pc.ontrack = (event) => {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                };

                localVideo.srcObject = localStream;
                remoteVideo.srcObject = remoteStream;

                // Explicitly tell mobile browsers to begin video play cycles
                localVideo.play().catch(e => console.log("Local playback catch:", e));
                remoteVideo.play().catch(e => console.log("Remote playback catch:", e));

                createBtn.disabled = false;
                joinBtn.disabled = false;
                startBtn.disabled = true;
                log("Camera & microphone linked successfully.");
            } catch (err) {
                alert(`Hardware Permissions Rejected: ${err.message}`);
                log(`Error acquiring hardware links: ${err.name}`);
            }
        };

        // 2. Caller Execution Path
        createBtn.onclick = async () => {
            log("Generating secure signaling session...");
            const callsRef = ref(db, 'calls');
            const newCallRef = push(callsRef);
            const callId = newCallRef.key;
            
            callIdInput.value = callId;
            log(`Session created! Share this ID: ${callId}`);

            const localCandidatesRef = ref(db, `calls/${callId}/localCandidates`);
            const remoteCandidatesRef = ref(db, `calls/${callId}/remoteCandidates`);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(localCandidatesRef, event.candidate.toJSON());
                }
            };

            const offerDescription = await pc.createOffer();
            await pc.setLocalDescription(offerDescription);

            const offer = { sdp: offerDescription.sdp, type: offerDescription.type };
            await set(ref(db, `calls/${callId}/offer`), offer);

            // Await remote answer handshake block
            onValue(ref(db, `calls/${callId}/answer`), (snapshot) => {
                const data = snapshot.val();
                if (!pc.currentRemoteDescription && data) {
                    log("Peer answered! Negotiating connection lines...");
                    const answerDescription = new RTCSessionDescription(data);
                    pc.setRemoteDescription(answerDescription);
                }
            });

            onValue(remoteCandidatesRef, (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    pc.addIceCandidate(new RTCIceCandidate(data)).catch(e => {});
                });
            });

            pc.onconnectionstatechange = () => log(`Connection State: ${pc.connectionState}`);
        };

        // 3. Receiver Execution Path
        joinBtn.onclick = async () => {
            const callId = callIdInput.value.trim();
            if (!callId) return alert("Please enter an active Call ID channel code first!");

            log(`Connecting to session reference path: ${callId}...`);
            const localCandidatesRef = ref(db, `calls/${callId}/localCandidates`);
            const remoteCandidatesRef = ref(db, `calls/${callId}/remoteCandidates`);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(remoteCandidatesRef, event.candidate.toJSON());
                }
            };

            const offerSnapshot = await get(ref(db, `calls/${callId}/offer`));
            if (!offerSnapshot.exists()) {
                alert("Invalid Call ID! Channel resource not found.");
                return;
            }
            
            const offerDescription = offerSnapshot.val();
            await pc.setRemoteDescription(new RTCSessionDescription(offerDescription));

            const answerDescription = await pc.createAnswer();
            await pc.setLocalDescription(answerDescription);

            const answer = { type: answerDescription.type, sdp: answerDescription.sdp };
            await set(ref(db, `calls/${callId}/answer`), answer);

            onValue(localCandidatesRef, (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    pc.addIceCandidate(new RTCIceCandidate(data)).catch(e => {});
                });
            });

            pc.onconnectionstatechange = () => log(`Connection State: ${pc.connectionState}`);
        };
    </script>
</body>
</html>
