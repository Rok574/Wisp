
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WispRTC">
    <meta name="theme-color" content="#0b0d12">
    <title>WispRTC</title>
    <style>
        :root {
            --bg: #0b0d12;
            --panel: #16181f;
            --panel-2: #1c1f29;
            --line: rgba(255,255,255,.08);
            --text: #f4f6fb;
            --muted: #9aa3b5;
            --dim: #6f7890;
            --accent: #6d7cff;
            --accent-2: #5460e8;
            --green: #3dd68c;
            --red: #f23f42;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --bar-space: calc(118px + var(--safe-bottom));
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
        body {
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(900px 480px at 50% -20%, rgba(109,124,255,.18), transparent 55%),
                var(--bg);
        }
        body.in-call { background: #0b0d12; overflow: hidden; }
        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            z-index: 6;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.2px; }
        .logo {
            width: 32px; height: 32px; border-radius: 10px;
            background: linear-gradient(180deg, #8b97ff, #5b67f5);
            display: grid; place-items: center;
            box-shadow: 0 8px 20px rgba(91,103,245,.28);
        }
        .logo svg { width: 18px; height: 18px; display: block; }
        .live {
            display: none; align-items: center; gap: 10px;
            font-size: 13px; color: var(--muted);
            background: rgba(255,255,255,.04);
            border: 1px solid var(--line);
            padding: 6px 8px 6px 12px;
            border-radius: 999px;
        }
        .live.on { display: flex; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        .copy {
            border: 0; background: rgba(255,255,255,.08); color: #fff;
            border-radius: 999px; padding: 6px 11px; font-weight: 650; font-size: 12px;
        }
        #httpsWarn {
            display: none; margin: 0 16px 12px; padding: 10px 12px;
            background: #3a2a12; color: #f0c36a; border-radius: 12px; font-size: 13px;
        }
        #lobbyWrap {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 12px 16px 28px;
        }
        body.in-call #lobbyWrap { display: none; }
        #lobby {
            width: min(440px, 100%);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 28px 24px 22px;
            box-shadow: 0 24px 80px rgba(0,0,0,.35);
        }
        #lobby h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.4px; }
        #lobby p { margin: 0 0 8px; color: var(--muted); font-size: 14px; line-height: 1.45; }
        label {
            display: block; font-size: 11px; font-weight: 750;
            letter-spacing: .5px; color: var(--dim);
            margin: 16px 0 8px; text-transform: uppercase;
        }
        #lobby input {
            width: 100%; padding: 14px 14px; border: 1px solid var(--line);
            border-radius: 12px; background: var(--panel-2); color: var(--text);
            font-size: 16px; outline: none;
        }
        #lobby input:focus { border-color: var(--accent); }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .actions button {
            flex: 1; border: 0; border-radius: 12px; padding: 13px 10px;
            font-weight: 750; font-size: 15px; color: #fff;
        }
        .go { background: var(--accent); }
        .go:active { background: var(--accent-2); }
        .ghost { background: #2a2e3a; }
        .user-row {
            display: flex; align-items: center; gap: 10px;
            margin-top: 16px; color: var(--muted); font-size: 13px;
        }
        .ava {
            width: 28px; height: 28px; border-radius: 50%;
            display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 12px;
            background: var(--accent);
        }
        #stage {
            display: none;
            flex: 1;
            position: relative;
            min-height: 0;
        }
        body.in-call #stage { display: block; }
        #videos {
            height: 100%;
            display: grid;
            gap: 12px;
            padding: 4px 16px var(--bar-space);
            align-content: stretch;
            justify-items: stretch;
            grid-template-columns: 1fr;
            grid-auto-rows: minmax(0, 1fr);
        }
        #videos.one { grid-template-columns: 1fr; }
        #videos.count-2 { grid-template-columns: 1fr; }
        #videos.count-3, #videos.count-4 { grid-template-columns: 1fr 1fr; }
        .tile {
            position: relative;
            background: #12141b;
            border-radius: 18px;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            border: 1px solid var(--line);
            cursor: pointer;
        }
        .tile.focused { cursor: zoom-out; border-color: rgba(109,124,255,.45); }
        #videos.focus {
            grid-template-columns: 1fr !important;
            grid-template-rows: 1fr;
        }
        #videos.focus > .tile { display: none; }
        #videos.focus > .tile.focused {
            display: block;
            position: relative !important;
            width: auto !important;
            height: auto !important;
            right: auto !important;
            bottom: auto !important;
            min-height: 0;
            z-index: 1;
            box-shadow: none;
        }
        #videos.focus > .tile.local:not(.focused) {
            display: block;
            position: absolute !important;
            width: min(160px, 34vw) !important;
            height: 100px !important;
            right: 16px !important;
            bottom: var(--bar-space) !important;
            z-index: 6;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,.45);
        }
        #videos.focus > .tile.focused.sharing video,
        #videos.focus > .tile.focused.fit video { object-fit: contain; }
        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            background: #0a0c11;
            display: block;
        }
        .tile.fit video { object-fit: contain; }
        .tile.sharing video { object-fit: contain; }
        .tile.local video { transform: scaleX(-1); }
        .tile.local.back-camera video,
        .tile.local.sharing video { transform: none; }
        .tile.cam-off video { opacity: 0; }
        .cam-off-badge {
            display: none; position: absolute; inset: 0;
            align-items: center; justify-content: center; flex-direction: column; gap: 10px;
            background: #141722; color: var(--muted); font-size: 13px; font-weight: 700;
        }
        .tile.cam-off .cam-off-badge { display: flex; }
        .cam-off-badge .ava { width: 72px; height: 72px; font-size: 26px; }
        .label {
            position: absolute; left: 12px; bottom: 12px;
            font-size: 13px; font-weight: 700;
            background: rgba(10,12,18,.72);
            backdrop-filter: blur(10px);
            padding: 6px 10px; border-radius: 999px;
            display: flex; align-items: center; gap: 7px;
            max-width: calc(100% - 90px);
            z-index: 2;
        }
        .micdot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
        .micdot.off { background: var(--red); }
        .tile-btns { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 2; }
        .tile-btns button {
            height: 32px; padding: 0 10px; border: 0; border-radius: 999px;
            background: rgba(10,12,18,.72); color: #fff; font-size: 12px; font-weight: 700;
        }
        .tile-btns button.on { background: var(--red); }
        .share-pill {
            display: none;
            position: absolute; top: 12px; left: 12px;
            font-size: 11px; font-weight: 800; letter-spacing: .3px;
            background: var(--accent); color: #fff;
            padding: 5px 10px; border-radius: 999px; z-index: 2;
        }
        .tile.sharing .share-pill { display: block; }
        @media (min-width: 760px) {
            #videos.count-2 { grid-template-columns: 1fr; padding-right: 16px; }
            #videos:not(.one) .tile.local {
                position: absolute;
                width: min(260px, 30vw);
                height: min(168px, 22vh);
                right: 22px;
                bottom: var(--bar-space);
                z-index: 5;
                border-radius: 16px;
                box-shadow: 0 16px 40px rgba(0,0,0,.4);
            }
            #videos.count-3, #videos.count-4 { grid-template-columns: 1fr 1fr; }
            #videos.count-5, #videos.count-6 { grid-template-columns: 1fr 1fr 1fr; }
        }
        @media (max-width: 759px) {
            #videos { padding: 0 12px var(--bar-space); gap: 10px; }
            #videos.count-2 .tile.local { min-height: 140px; }
            .tile { border-radius: 16px; }
        }
        .bar {
            position: fixed; left: 50%; bottom: calc(16px + var(--safe-bottom));
            transform: translateX(-50%);
            display: none;
            align-items: center; gap: 8px;
            padding: 10px 12px;
            background: rgba(22,24,31,.86);
            border: 1px solid var(--line);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            z-index: 8;
            max-width: calc(100vw - 16px);
            overflow-x: auto;
        }
        body.in-call .bar { display: flex; }
        .bar button {
            width: 48px; height: 48px; border: 0; border-radius: 50%;
            background: #2a2e3a; color: #fff; font-size: 10px; font-weight: 750;
            flex-shrink: 0;
        }
        .bar button.on { background: var(--red); }
        .bar #shareBtn.on { background: var(--accent); }
        .bar #hangup { background: var(--red); width: 56px; }
        .log { display: none; }
        @media (min-width: 760px) {
            .bar button { width: 52px; height: 52px; }
        }
        @media (orientation: landscape) and (max-height: 520px) {
            :root { --bar-space: 8px; }
            body { min-height: 100dvh; }
            body.in-call .topbar {
                height: 32px;
                padding: 0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            }
            body.in-call .logo { width: 22px; height: 22px; border-radius: 7px; }
            body.in-call .logo svg { width: 12px; height: 12px; }
            body.in-call .brand { font-size: 13px; gap: 8px; }
            body.in-call .live { padding: 3px 6px 3px 8px; font-size: 11px; }
            body.in-call .copy { padding: 4px 8px; font-size: 11px; }
            #lobbyWrap {
                align-items: stretch;
                padding: 6px max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
            }
            #lobby {
                width: min(720px, 100%);
                padding: 14px 16px 12px;
                border-radius: 16px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto auto auto;
                column-gap: 16px;
                align-content: start;
            }
            #lobby h2 { font-size: 20px; grid-column: 1; margin: 0 0 4px; }
            #lobby p { display: none; }
            #lobby label[for="nameInput"], #nameInput { grid-column: 1; }
            #lobby label[for="roomInput"], #roomInput { grid-column: 2; }
            #lobby label { margin: 6px 0 6px; }
            #lobby input { padding: 10px 12px; }
            #lobby > div[style] { display: none; }
            #lobby .actions { grid-column: 1 / -1; margin-top: 10px; }
            #lobby .user-row { grid-column: 1 / -1; margin-top: 8px; }
            #videos {
                padding: 2px 76px 4px max(6px, env(safe-area-inset-left));
                gap: 8px;
            }
            #videos.count-2 { grid-template-columns: 1fr; }
            #videos.count-2 .tile.local { min-height: 0; }
            #videos.count-3, #videos.count-4 { grid-template-columns: 1fr 1fr; }
            #videos:not(.one):not(.focus) .tile.local {
                position: absolute;
                width: min(132px, 28vw);
                height: 78px;
                right: calc(76px + env(safe-area-inset-right, 0px));
                bottom: 8px;
                z-index: 5;
                border-radius: 12px;
                box-shadow: 0 10px 24px rgba(0,0,0,.4);
            }
            #videos.focus { padding-right: 76px; }
            #videos.focus > .tile.local:not(.focused) {
                width: 110px !important;
                height: 68px !important;
                right: calc(76px + env(safe-area-inset-right, 0px)) !important;
                bottom: 8px !important;
            }
            .tile { border-radius: 12px; }
            .label { left: 8px; bottom: 8px; font-size: 12px; padding: 4px 8px; }
            .tile-btns { right: 8px; bottom: 8px; }
            .tile-btns button { height: 26px; font-size: 11px; }
            .cam-off-badge .ava { width: 48px; height: 48px; font-size: 18px; }
            .bar {
                left: auto;
                right: max(6px, env(safe-area-inset-right));
                top: 50%;
                bottom: auto;
                transform: translateY(-50%);
                flex-direction: column;
                gap: 6px;
                padding: 8px;
                max-width: none;
                max-height: calc(100dvh - 16px);
                overflow-y: auto;
                overflow-x: hidden;
            }
            .bar button {
                width: 40px;
                height: 40px;
                font-size: 9px;
            }
            .bar #hangup { width: 40px; height: 42px; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M5 15c3-8 11-8 14 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M8 16.5c2-4.5 6-4.5 8 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="12" cy="18.2" r="1.5" fill="#fff"/>
                </svg>
            </div>
            WispRTC
        </div>
        <div id="roomChip" class="live">
            <span class="dot"></span>
            <span id="roomLabel">room</span>
            <button id="copyBtn" class="copy" type="button">Copy</button>
        </div>
    </div>
    <div id="httpsWarn">iPhone and iPad need HTTPS for camera and mic.</div>
    <div id="lobbyWrap">
        <div id="lobby">
            <h2>Hop into a room</h2>
            <p>Your username is saved on this device. Share a room code with anyone, even on another WiFi.</p>
            <label for="nameInput">Username</label>
            <input id="nameInput" type="text" placeholder="cooluser" maxlength="20" autocomplete="username" autocapitalize="off">
            <label for="roomInput">Room code</label>
            <input id="roomInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="Custom code (optional)">
            <div style="margin-top:7px;color:var(--dim);font-size:12px;">Enter any code to create or join that room.</div>
            <div class="actions">
                <button class="go" id="joinBtn" type="button">Join</button>
                <button class="ghost" id="createBtn" type="button">New room</button>
            </div>
            <div class="user-row">
                <div class="ava" id="previewAva">?</div>
                <span id="savedHint">No saved username yet</span>
            </div>
        </div>
    </div>
    <div id="stage">
        <div id="videos" class="one count-1">
            <div class="tile local" id="localTile">
                <video id="localVideo" autoplay playsinline webkit-playsinline muted></video>
                <div class="share-pill">Sharing screen</div>
                <div class="cam-off-badge">
                    <div class="ava" id="localAva">Y</div>
                    Camera off
                </div>
                <div class="label"><span class="micdot" id="localMicDot"></span><span id="localName">You</span></div>
                <div class="tile-btns">
                    <button id="fitBtn" type="button">Fit</button>
                </div>
            </div>
        </div>
    </div>
    <div class="bar" id="callBar">
        <button id="muteBtn" type="button">Mute</button>
        <button id="camBtn" type="button">Video</button>
        <button id="flipBtn" type="button">Flip</button>
        <button id="shareBtn" type="button">Share</button>
        <button id="hangup" type="button">Leave</button>
    </div>
    <div id="statusLog" class="log"></div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
        import {
            getDatabase, ref, set, push, onValue, onChildAdded, onChildRemoved, remove, runTransaction
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCjbcnSZc5uEcbEqgn68H-CLx2MoMpuqgA",
            authDomain: "jhghugjh-432da.firebaseapp.com",
            databaseURL: "https://jhghugjh-432da-default-rtdb.firebaseio.com",
            projectId: "jhghugjh-432da",
            storageBucket: "jhghugjh-432da.firebasestorage.app",
            messagingSenderId: "138235206183",
            appId: "1:138235206183:web:a49161586a06401664cc02",
            measurementId: "G-BDTG9XPRSQ"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const USER_KEY = "wisprtc.username";
        const FIT_KEY = "wisprtc.fill";
        const COLORS = ["#6d7cff","#3dd68c","#f5c542","#eb459e","#f23f42","#00a8fc","#f26522","#b57bff"];
        const EXTRA_TURN = [];
        const iceConfig = {
            iceServers: [
                { urls: [
                    "stun:stun.l.google.com:19302",
                    "stun:stun1.l.google.com:19302",
                    "stun:stun.cloudflare.com:3478"
                ]},
                {
                    urls: [
                        "turn:openrelay.metered.ca:80",
                        "turn:openrelay.metered.ca:80?transport=tcp",
                        "turn:openrelay.metered.ca:443?transport=tcp",
                        "turns:openrelay.metered.ca:443"
                    ],
                    username: "openrelayproject",
                    credential: "openrelayproject"
                },
                ...EXTRA_TURN
            ],
            iceCandidatePoolSize: 8
        };
        const iceRelayOnly = {
            iceServers: iceConfig.iceServers.filter(s => {
                const list = [].concat(s.urls || []);
                return list.some(x => String(x).startsWith("turn"));
            }),
            iceTransportPolicy: "relay",
            iceCandidatePoolSize: 8
        };
        const videosEl = document.getElementById("videos");
        const localVideo = document.getElementById("localVideo");
        const localTile = document.getElementById("localTile");
        const localName = document.getElementById("localName");
        const roomInput = document.getElementById("roomInput");
        const nameInput = document.getElementById("nameInput");
        const roomChip = document.getElementById("roomChip");
        const roomLabel = document.getElementById("roomLabel");
        const muteBtn = document.getElementById("muteBtn");
        const camBtn = document.getElementById("camBtn");
        const flipBtn = document.getElementById("flipBtn");
        const shareBtn = document.getElementById("shareBtn");
        const fitBtn = document.getElementById("fitBtn");
        const statusLog = document.getElementById("statusLog");
        const previewAva = document.getElementById("previewAva");
        const savedHint = document.getElementById("savedHint");
        const localAva = document.getElementById("localAva");
        const localMicDot = document.getElementById("localMicDot");
        if (!window.isSecureContext) document.getElementById("httpsWarn").style.display = "block";
        let localStream = null;
        let cameraStream = null;
        let screenStream = null;
        let myId = null;
        let roomId = null;
        let displayName = "You";
        let facing = "user";
        let micOn = true;
        let camOn = true;
        let sharing = false;
        let fillMode = storeGet(FIT_KEY) !== "0";
        const peers = new Map();
        let participantsUnsub = null;
        let removedUnsub = null;
        function storeGet(key) {
            try { return localStorage.getItem(key) || ""; } catch (_) { return ""; }
        }
        function storeSet(key, val) {
            try { localStorage.setItem(key, val); } catch (_) {}
        }
        function colorFor(name) {
            let n = 0;
            for (const ch of String(name)) n = (n + ch.charCodeAt(0)) % COLORS.length;
            return COLORS[n];
        }
        function initial(name) {
            return (String(name || "?").trim()[0] || "?").toUpperCase();
        }
        function paintAva(el, name) {
            if (!el) return;
            el.textContent = initial(name);
            el.style.background = colorFor(name || "?");
        }
        function log(t) { statusLog.textContent = t; console.log(t); }
        function uid() {
            return Math.random().toString(36).slice(2, 8).toUpperCase();
        }
        function cleanRoomCode(raw) {
            return String(raw || "")
                .trim()
                .replace(/[.#$\[\]\/]/g, "")
                .replace(/\s+/g, "-")
                .replace(/[^a-zA-Z0-9_-]/g, "")
                .slice(0, 32)
                .toUpperCase();
        }
        function applyFitMode() {
            document.querySelectorAll(".tile").forEach(t => {
                const useFit = t.classList.contains("sharing") || !fillMode;
                t.classList.toggle("fit", useFit);
                t.classList.toggle("fill", !useFit);
            });
            fitBtn.textContent = fillMode ? "Fill" : "Fit";
        }
        function syncCameraMirror() {
            const track = localStream?.getVideoTracks?.()[0];
            const mode = track?.getSettings?.().facingMode || facing;
            localTile.classList.toggle("back-camera", !sharing && mode === "environment");
            localTile.classList.toggle("sharing", sharing);
        }
        async function playVideo(el) { try { await el.play(); } catch (_) {} }
        let focusedTileId = null;
        function setFocusedTile(tile) {
            const id = tile?.id || null;
            if (focusedTileId && focusedTileId === id) tile = null;
            document.querySelectorAll(".tile.focused").forEach(t => t.classList.remove("focused"));
            if (!tile || videosEl.children.length <= 1) {
                focusedTileId = null;
                videosEl.classList.remove("focus");
                layout();
                return;
            }
            tile.classList.add("focused");
            focusedTileId = tile.id;
            videosEl.classList.add("focus");
            layout();
            const v = tile.querySelector("video");
            if (v) playVideo(v);
        }
        function bindTileFocus(tile) {
            tile.addEventListener("click", (e) => {
                if (e.target.closest("button")) return;
                setFocusedTile(tile);
            });
        }
        function layout() {
            const n = videosEl.children.length;
            const keepFocus = videosEl.classList.contains("focus");
            videosEl.className = videosEl.className
                .replace(/count-\d+/g, "")
                .replace(/\bone\b/g, "")
                .replace(/\bfocus\b/g, "")
                .trim() + " count-" + n;
            if (n <= 1) videosEl.classList.add("one");
            if (keepFocus && focusedTileId && document.getElementById(focusedTileId)) {
                videosEl.classList.add("focus");
            } else if (n <= 1) {
                focusedTileId = null;
                document.querySelectorAll(".tile.focused").forEach(t => t.classList.remove("focused"));
            }
            applyFitMode();
        }
        function cleanUsername(raw) {
            return String(raw || "").replace(/\s+/g, " ").trim().slice(0, 20);
        }
        function refreshUserPreview() {
            const name = cleanUsername(nameInput.value) || storeGet(USER_KEY);
            paintAva(previewAva, name || "?");
            savedHint.textContent = name ? ("Saved as " + name) : "No saved username yet";
        }
        nameInput.value = storeGet(USER_KEY);
        refreshUserPreview();
        applyFitMode();
        bindTileFocus(localTile);
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && focusedTileId) setFocusedTile(null);
        });
        nameInput.addEventListener("input", () => {
            const name = cleanUsername(nameInput.value);
            if (name) storeSet(USER_KEY, name);
            refreshUserPreview();
        });
        async function attachLocal(stream) {
            localVideo.srcObject = null;
            localVideo.srcObject = stream;
            localVideo.muted = true;
            localVideo.setAttribute("playsinline", "");
            localVideo.setAttribute("webkit-playsinline", "");
            await new Promise(resolve => {
                if (localVideo.readyState >= 2) return resolve();
                const done = () => {
                    localVideo.removeEventListener("loadedmetadata", done);
                    localVideo.removeEventListener("canplay", done);
                    resolve();
                };
                localVideo.addEventListener("loadedmetadata", done);
                localVideo.addEventListener("canplay", done);
                setTimeout(resolve, 800);
            });
            await playVideo(localVideo);
        }
        async function getMedia(face = facing) {
            if (!navigator.mediaDevices?.getUserMedia) {
                throw new Error("Need HTTPS for camera on iPhone/iPad");
            }
            const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
            const tries = [
                { video: { facingMode: { exact: face } }, audio },
                { video: { facingMode: { ideal: face } }, audio },
                { video: { facingMode: face }, audio },
                { video: true, audio: true }
            ];
            let last;
            for (const c of tries) {
                try { return await navigator.mediaDevices.getUserMedia(c); }
                catch (e) { last = e; }
            }
            throw last;
        }
        async function replaceOutgoingVideo(track) {
            for (const { pc } of peers.values()) {
                const sender = pc.getSenders().find(s => s.track && s.track.kind === "video")
                    || pc.getSenders().find(s => s.track == null && s.track === null);
                const videoSender = pc.getSenders().find(s => (s.track && s.track.kind === "video") || s.track == null);
                const s = pc.getSenders().find(x => x.track?.kind === "video") || pc.getSenders().find(x => !x.track);
                if (s && track) {
                    try { await s.replaceTrack(track); } catch (_) {}
                }
            }
        }
        async function replaceOutgoingAudio(track) {
            for (const { pc } of peers.values()) {
                const s = pc.getSenders().find(x => x.track?.kind === "audio");
                if (s && track) {
                    try { await s.replaceTrack(track); } catch (_) {}
                }
            }
        }
        function applyLocalMediaState() {
            if (!localStream) return;
            localStream.getAudioTracks().forEach(t => t.enabled = micOn);
            if (!sharing) localStream.getVideoTracks().forEach(t => t.enabled = camOn);
            localTile.classList.toggle("cam-off", !camOn && !sharing);
            localMicDot.classList.toggle("off", !micOn);
            muteBtn.classList.toggle("on", !micOn);
            muteBtn.textContent = micOn ? "Mute" : "Unmute";
            camBtn.classList.toggle("on", !camOn);
            camBtn.textContent = camOn ? "Video" : "Cam off";
            shareBtn.classList.toggle("on", sharing);
            shareBtn.textContent = sharing ? "Stop" : "Share";
            flipBtn.disabled = sharing;
            flipBtn.style.opacity = sharing ? ".45" : "1";
            syncCameraMirror();
            publishState();
        }
        async function publishState() {
            if (!roomId || !myId) return;
            try {
                await set(ref(db, `rooms/${roomId}/participants/${myId}`), {
                    name: displayName, micOn, camOn, sharing, joinedAt: Date.now()
                });
            } catch (_) {}
        }
        async function startMedia() {
            if (localStream && !sharing) return localStream;
            cameraStream = await getMedia();
            localStream = cameraStream;
            await attachLocal(localStream);
            syncCameraMirror();
            applyLocalMediaState();
            return localStream;
        }
        document.getElementById("createBtn").onclick = async () => {
            roomInput.value = uid();
            await enter();
        };
        document.getElementById("joinBtn").onclick = () => enter();
        roomInput.addEventListener("input", () => {
            const start = roomInput.selectionStart;
            const cleaned = cleanRoomCode(roomInput.value);
            roomInput.value = cleaned;
            if (start !== null) {
                try { roomInput.setSelectionRange(cleaned.length, cleaned.length); } catch (_) {}
            }
        });
        roomInput.addEventListener("keydown", e => {
            if (e.key === "Enter") {
                e.preventDefault();
                enter();
            }
        });
        document.getElementById("copyBtn").onclick = async () => {
            try { await navigator.clipboard.writeText(roomId); } catch (_) {}
            document.getElementById("copyBtn").textContent = "Copied";
            setTimeout(() => document.getElementById("copyBtn").textContent = "Copy", 1200);
        };
        muteBtn.onclick = () => { micOn = !micOn; applyLocalMediaState(); };
        camBtn.onclick = () => {
            if (sharing) return;
            camOn = !camOn;
            applyLocalMediaState();
        };
        fitBtn.onclick = () => {
            fillMode = !fillMode;
            storeSet(FIT_KEY, fillMode ? "1" : "0");
            applyFitMode();
        };
        flipBtn.onclick = async () => {
            if (sharing) return;
            const nextFacing = facing === "user" ? "environment" : "user";
            flipBtn.disabled = true;
            try {
                const next = await getMedia(nextFacing);
                const old = cameraStream;
                cameraStream = next;
                localStream = next;
                const settings = next.getVideoTracks()[0]?.getSettings?.() || {};
                facing = settings.facingMode || nextFacing;
                await attachLocal(localStream);
                syncCameraMirror();
                applyLocalMediaState();
                const vt = localStream.getVideoTracks()[0];
                const at = localStream.getAudioTracks()[0];
                await replaceOutgoingVideo(vt);
                await replaceOutgoingAudio(at);
                if (old && old !== next) old.getTracks().forEach(t => t.stop());
            } catch (e) { log("Flip failed"); }
            flipBtn.disabled = sharing;
        };
        shareBtn.onclick = () => toggleShare();
        async function toggleShare() {
            if (sharing) {
                await stopShare();
                return;
            }
            if (!navigator.mediaDevices?.getDisplayMedia) {
                alert("Screen sharing is not available in this browser. Try Chrome or Edge on desktop.");
                return;
            }
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 15, cursor: "always" },
                    audio: false
                });
            } catch (e) {
                log("Share cancelled");
                return;
            }
            const screenTrack = screenStream.getVideoTracks()[0];
            if (!screenTrack) return;
            sharing = true;
            camOn = true;
            const mixed = new MediaStream();
            mixed.addTrack(screenTrack);
            const mic = (cameraStream || localStream)?.getAudioTracks?.()[0];
            if (mic) mixed.addTrack(mic);
            localStream = mixed;
            localVideo.srcObject = localStream;
            await playVideo(localVideo);
            applyLocalMediaState();
            applyFitMode();
            await replaceOutgoingVideo(screenTrack);
            screenTrack.onended = () => { stopShare(); };
        }
        async function stopShare() {
            if (!sharing) return;
            sharing = false;
            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
            }
            try {
                if (!cameraStream || !cameraStream.getVideoTracks().some(t => t.readyState === "live")) {
                    cameraStream = await getMedia(facing);
                }
            } catch (_) {}
            localStream = cameraStream;
            if (localStream) {
                localVideo.srcObject = localStream;
                await playVideo(localVideo);
                const vt = localStream.getVideoTracks()[0];
                const at = localStream.getAudioTracks()[0];
                if (vt) await replaceOutgoingVideo(vt);
                if (at) await replaceOutgoingAudio(at);
            }
            applyLocalMediaState();
            applyFitMode();
        }
        document.getElementById("hangup").onclick = () => leaveRoom(true);
        async function enter() {
            displayName = cleanUsername(nameInput.value);
            if (!displayName) {
                nameInput.focus();
                alert("Type a username first.");
                return;
            }
            nameInput.value = displayName;
            storeSet(USER_KEY, displayName);
            refreshUserPreview();
            localName.textContent = displayName;
            paintAva(localAva, displayName);
            const typedCode = cleanRoomCode(roomInput.value);
            const id = typedCode || uid();
            roomInput.value = id;
            try { await startMedia(); }
            catch (err) {
                alert("Camera or mic blocked. On iPhone use HTTPS and allow Camera and Mic.");
                return;
            }
            await joinRoom(id);
        }
        function setInCall(on) {
            document.body.classList.toggle("in-call", on);
        }
        async function deleteRoomIfEmpty(id) {
            if (!id) return;
            try {
                await runTransaction(ref(db, `rooms/${id}`), current => {
                    if (!current) return current;
                    const participants = current.participants || {};
                    if (Object.keys(participants).length === 0) return null;
                    return current;
                });
            } catch (_) {}
        }
        async function joinRoom(id) {
            id = cleanRoomCode(id);
            if (!id) throw new Error("Invalid room code");
            await leaveRoom(false);
            roomId = id;
            myId = uid() + Date.now().toString(36).slice(-3);
            setInCall(true);
            roomChip.classList.add("on");
            roomLabel.textContent = roomId;
            log("In room " + roomId);
            await publishState();
            window.addEventListener("pagehide", onPageHide);
            window.addEventListener("beforeunload", onPageHide);
            const partsRef = ref(db, `rooms/${roomId}/participants`);
            participantsUnsub = onChildAdded(partsRef, async (snap) => {
                const remoteId = snap.key;
                if (!remoteId || remoteId === myId) return;
                await ensurePeer(remoteId, myId < remoteId, false, snap.val());
            });
            removedUnsub = onChildRemoved(partsRef, async (snap) => {
                if (snap.key && snap.key !== myId) teardownPeer(snap.key);
                await deleteRoomIfEmpty(roomId);
            });
            onValue(partsRef, (snap) => {
                if (!snap.exists()) {
                    deleteRoomIfEmpty(roomId);
                    return;
                }
                snap.forEach(child => {
                    if (child.key === myId) return;
                    if (peers.get(child.key)) updateRemoteChrome(child.key, child.val() || {});
                });
            });
        }
        function signalPath(a, b, leaf, relayOnly = false) {
            const [x, y] = a < b ? [a, b] : [b, a];
            return `rooms/${roomId}/signals/${x}_${y}/${relayOnly ? "relay" : "p2p"}/${leaf}`;
        }
        function updateRemoteChrome(remoteId, info) {
            const tile = document.getElementById("tile-" + remoteId);
            if (!tile) return;
            const nameEl = tile.querySelector("[data-name]");
            const n = info.name || remoteId.slice(0, 6);
            if (nameEl) nameEl.textContent = n + (info.micOn === false ? " muted" : "");
            const dot = tile.querySelector(".micdot");
            if (dot) dot.classList.toggle("off", info.micOn === false);
            tile.classList.toggle("cam-off", info.camOn === false && !info.sharing);
            tile.classList.toggle("sharing", !!info.sharing);
            paintAva(tile.querySelector(".cam-off-badge .ava"), n);
            applyFitMode();
        }
        async function ensurePeer(remoteId, iAmOfferer, relayOnly = false, info = {}) {
            if (peers.has(remoteId) || !localStream || !roomId) return;
            const pc = new RTCPeerConnection(relayOnly ? iceRelayOnly : iceConfig);
            const unsubscribers = [];
            const remoteStream = new MediaStream();
            peers.set(remoteId, { pc, unsubscribers, remoteStream, muted: false });
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            const tile = document.createElement("div");
            tile.className = "tile remote";
            tile.id = "tile-" + remoteId;
            const v = document.createElement("video");
            v.autoplay = true;
            v.playsInline = true;
            v.setAttribute("playsinline", "");
            v.setAttribute("webkit-playsinline", "");
            v.srcObject = remoteStream;
            v.addEventListener("loadedmetadata", () => playVideo(v));
            v.addEventListener("canplay", () => playVideo(v));
            const badge = document.createElement("div");
            badge.className = "cam-off-badge";
            const av = document.createElement("div");
            av.className = "ava";
            paintAva(av, info.name || remoteId);
            badge.append(av, document.createTextNode("Camera off"));
            const sharePill = document.createElement("div");
            sharePill.className = "share-pill";
            sharePill.textContent = "Sharing screen";
            const label = document.createElement("div");
            label.className = "label";
            const dot = document.createElement("span");
            dot.className = "micdot";
            const nameEl = document.createElement("span");
            nameEl.setAttribute("data-name", "");
            nameEl.textContent = info.name || remoteId.slice(0, 6);
            label.append(dot, nameEl);
            const btns = document.createElement("div");
            btns.className = "tile-btns";
            const muteThem = document.createElement("button");
            muteThem.type = "button";
            muteThem.textContent = "Mute";
            muteThem.title = "Mute this person for you";
            muteThem.onclick = () => {
                const p = peers.get(remoteId);
                if (!p) return;
                p.muted = !p.muted;
                p.remoteStream.getAudioTracks().forEach(t => t.enabled = !p.muted);
                muteThem.classList.toggle("on", p.muted);
                muteThem.textContent = p.muted ? "Hear" : "Mute";
            };
            btns.appendChild(muteThem);
            tile.append(v, sharePill, badge, label, btns);
            bindTileFocus(tile);
            videosEl.appendChild(tile);
            layout();
            playVideo(v);
            updateRemoteChrome(remoteId, info);
            pc.ontrack = (ev) => {
                ev.streams[0].getTracks().forEach(t => {
                    if (!remoteStream.getTracks().some(x => x.id === t.id)) remoteStream.addTrack(t);
                });
                if (ev.track) {
                    ev.track.onunmute = () => playVideo(v);
                    ev.track.onended = () => {
                        try { remoteStream.removeTrack(ev.track); } catch (_) {}
                    };
                }
                const p = peers.get(remoteId);
                if (p?.muted) remoteStream.getAudioTracks().forEach(t => t.enabled = false);
                v.srcObject = remoteStream;
                playVideo(v);
            };
            pc.onconnectionstatechange = () => {
                log((info.name || remoteId.slice(0, 6)) + ": " + pc.connectionState);
                if (pc.connectionState === "failed") try { pc.restartIce(); } catch (_) {}
            };
            if (!relayOnly) {
                setTimeout(async () => {
                    const entry = peers.get(remoteId);
                    if (!entry || entry.pc !== pc) return;
                    if (pc.connectionState === "connected") return;
                    teardownPeer(remoteId);
                    await ensurePeer(remoteId, iAmOfferer, true, info);
                }, 8000);
            }
            const candRef = ref(db, signalPath(myId, remoteId, "candidates/" + myId, relayOnly));
            pc.onicecandidate = (ev) => { if (ev.candidate) push(candRef, ev.candidate.toJSON()); };
            unsubscribers.push(onChildAdded(ref(db, signalPath(myId, remoteId, "candidates/" + remoteId, relayOnly)), (snap) => {
                if (snap.val()) pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(() => {});
            }));
            const offerRef = ref(db, signalPath(myId, remoteId, "offer", relayOnly));
            const answerRef = ref(db, signalPath(myId, remoteId, "answer", relayOnly));
            if (iAmOfferer) {
                const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
                await pc.setLocalDescription(offer);
                await set(offerRef, { type: offer.type, sdp: offer.sdp });
                unsubscribers.push(onValue(answerRef, async (snap) => {
                    const data = snap.val();
                    if (data && !pc.currentRemoteDescription) {
                        await pc.setRemoteDescription(new RTCSessionDescription(data));
                    }
                }));
            } else {
                unsubscribers.push(onValue(offerRef, async (snap) => {
                    const data = snap.val();
                    if (!data || pc.currentRemoteDescription) return;
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await set(answerRef, { type: answer.type, sdp: answer.sdp });
                }));
            }
        }
        function teardownPeer(remoteId) {
            const entry = peers.get(remoteId);
            if (!entry) return;
            entry.unsubscribers.forEach(fn => { try { fn(); } catch (_) {} });
            try { entry.pc.close(); } catch (_) {}
            peers.delete(remoteId);
            const gone = "tile-" + remoteId;
            document.getElementById(gone)?.remove();
            if (focusedTileId === gone) setFocusedTile(null);
            else layout();
        }
        function onPageHide() {
            if (roomId && myId) {
                remove(ref(db, `rooms/${roomId}/participants/${myId}`));
            }
        }
        async function leaveRoom(showLobby) {
            window.removeEventListener("pagehide", onPageHide);
            window.removeEventListener("beforeunload", onPageHide);
            if (participantsUnsub) { try { participantsUnsub(); } catch (_) {} participantsUnsub = null; }
            if (removedUnsub) { try { removedUnsub(); } catch (_) {} removedUnsub = null; }
            [...peers.keys()].forEach(teardownPeer);
            const leavingRoomId = roomId;
            const leavingUserId = myId;
            if (leavingRoomId && leavingUserId) {
                try {
                    await remove(ref(db, `rooms/${leavingRoomId}/participants/${leavingUserId}`));
                    await deleteRoomIfEmpty(leavingRoomId);
                } catch (_) {}
            }
            roomId = null;
            myId = null;
            if (showLobby) {
                setInCall(false);
                roomChip.classList.remove("on");
                await stopShare();
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (cameraStream) {
                    cameraStream.getTracks().forEach(t => t.stop());
                    cameraStream = null;
                }
                localVideo.srcObject = null;
                micOn = true;
                camOn = true;
                sharing = false;
                localTile.classList.remove("cam-off", "sharing");
                nameInput.value = storeGet(USER_KEY);
                refreshUserPreview();
                applyLocalMediaState();
            }
        }
    </script>
</body>
</html>
